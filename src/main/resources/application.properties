spring.application.name=BackendSistema

# ===============================
# PUERTO (Railway inyecta PORT)
# ===============================
server.port=${PORT:8080}

# ===============================
# MYSQL
# Orden de busqueda: DB_URL -> variables de Railway (MYSQLHOST, etc.) -> localhost
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQL_DATABASE:chicaemesas}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# CORREO
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL del frontend (para el enlace del correo de recuperacion)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# URL publica del backend (para las URLs de las imagenes subidas)
app.backend.url=${BACKEND_URL:http://localhost:8080}

# ===============================
# SUBIDA DE ARCHIVOS
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# GOOGLE SIGN-IN
# ===============================
google.client.id=${GOOGLE_CLIENT_ID}
